apiVersion: v1
kind: Secret
metadata:
  name: taxonomy-secrets
  namespace: taxonomy
  labels:
    app: taxonomy
type: Opaque
# ──────────────────────────────────────────────
# IMPORTANT: Replace values below with base64-encoded strings.
#   echo -n "your-value" | base64
#
# For production, use AWS Secrets Manager with the
# External Secrets Operator or Sealed Secrets instead.
# ──────────────────────────────────────────────
data:
  # PostgreSQL connection string (RDS endpoint)
  # Format: postgresql://user:password@rds-endpoint:5432/taxonomy?schema=public
  DATABASE_URL: "<base64-encoded-value>"

  # NextAuth
  NEXTAUTH_URL: "<base64-encoded-value>"
  NEXTAUTH_SECRET: "<base64-encoded-value>"

  # GitHub OAuth
  GITHUB_CLIENT_ID: "<base64-encoded-value>"
  GITHUB_CLIENT_SECRET: "<base64-encoded-value>"
  GITHUB_ACCESS_TOKEN: "<base64-encoded-value>"

  # Postmark (Email)
  SMTP_FROM: "<base64-encoded-value>"
  POSTMARK_API_TOKEN: "<base64-encoded-value>"
  POSTMARK_SIGN_IN_TEMPLATE: "<base64-encoded-value>"
  POSTMARK_ACTIVATION_TEMPLATE: "<base64-encoded-value>"

  # Stripe
  STRIPE_API_KEY: "<base64-encoded-value>"
  STRIPE_WEBHOOK_SECRET: "<base64-encoded-value>"
  STRIPE_PRO_MONTHLY_PLAN_ID: "<base64-encoded-value>"

  # Public
  NEXT_PUBLIC_APP_URL: "<base64-encoded-value>"
